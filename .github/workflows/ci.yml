name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-tests:
    name: CPU tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install lightweight test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Check test environment dependencies
        run: python -m pip check
      - name: Check Python correctness
        run: python -m ruff check .
      - name: Compile application and tests without importing models
        run: python -m compileall -q remwm.py remwmgui.py utils.py tests
      - name: Run CPU tests
        run: python -m pytest
      - name: Check Bash syntax
        if: runner.os != 'Windows'
        run: |
          bash -n setup.sh
          bash -n run.sh
      - name: Check PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'setup.ps1'), [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count) {
            $parseErrors | ForEach-Object { Write-Error $_ }
            exit 1
          }
